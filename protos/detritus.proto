syntax = "proto3";

package detritus;

// Atomic bank ledger event
message BankEvent {
    string event_id = 1;      // Unique for this event
    // Timestamp in UTC, ISO8601 format with microsecond precision (e.g., 2024-07-01T12:00:00.123456Z).
    // All timestamps in this schema use this format and precision.
    // If multiple events have the same timestamp, they are considered to have occurred simultaneously.
    string timestamp = 2;
    oneof event_type {
        AddPending add_pending = 10;
        RemovePending remove_pending = 11;
        AddCleared add_cleared = 12;
        UpdateBalance update_balance = 13;
        // ...add more as needed
    }
}

// A pending transaction is added
message AddPending {
    string event_id = 1; // Unique for this event
    string transaction_id = 2;
    string account_id = 3;
    // Amount in integer cents (e.g., USD 12.34 = 1234).
    // Positive = credit to account, negative = debit from account.
    int64 amount = 4;
    string description = 5;
    string merchant = 6;
    string category = 7;
    // ...other fields as needed
}

// A pending transaction is removed (e.g., when it clears)
message RemovePending {
    string event_id = 1; // Unique for this event
    string transaction_id = 2;
    string account_id = 3;
    string reason = 4; // e.g., "cleared", "canceled"
    string related_event_id = 5; // Link to add_pending
}

// A cleared transaction is added
message AddCleared {
    string event_id = 1; // Unique for this event
    string transaction_id = 2;
    string account_id = 3;
    int64 amount = 4; // See amount docs above
    string description = 5;
    string merchant = 6;
    string category = 7;
    string pending_event_id = 8; // Link to the pending event, if any
    // ...other fields as needed
}

// The available balance is updated
message UpdateBalance {
    string event_id = 1; // Unique for this event
    string account_id = 2;
    int64 new_balance = 3; // In integer cents. See sign convention docs above.
    string reason = 4; // e.g., "transaction", "fee", etc.
    string related_event_id = 5;
}

message BankLedger {
    repeated BankEvent events = 1;
}

// NOTE: We use string for timestamps for maximum compatibility and readability (ISO8601 UTC, e.g., 2024-07-01T12:00:00.123456Z).
// All timestamps are in UTC and use microsecond precision. If you want to use a numeric type (e.g., int64 micros since epoch), you can add an additional field or change the type as needed.
// All amounts are int64 in the smallest currency unit (e.g., cents). Positive = credit to account, negative = debit from account. 