[project]
name = "doppelbank"
version = "0.1.0"
description = "Simulator for financial histories"
authors = [
    {name = "Gregor Stocks"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8.4.1,<9.0.0)",
    "mypy (>=1.16.1,<2.0.0)",
    "black>=25.1.0",
]

[project.scripts]
bedrock = "doppelbank.bedrock.cli:main"
detritus = "doppelbank.detritus.cli:main"
veneer = "doppelbank.veneer.cli:main"
format = "black:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
