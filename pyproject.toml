[project]
name = "doppelbank"
version = "0.1.0"
description = "Simulator for financial histories"
authors = [
    {name = "Gregor Stocks"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8.4.1,<9.0.0)",
    "mypy (>=1.16.1,<2.0.0)"
]

[project.scripts]
generate = "doppelbank.generate.cli:main"

[project.optional-dependencies]
dev = [
    "black>=25.1.0,<26.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
