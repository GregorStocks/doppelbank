[project]
name = "doppelbank"
version = "0.1.0"
description = "Simulator for financial histories"
authors = [
    {name = "Gregor Stocks"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest (>=8.4.1,<9.0.0)",
    "pytz>=2024.1",
    "betterproto>=1.2.5",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
]

[project.scripts]
bedrock = "doppelbank.bedrock.cli:main"
detritus = "doppelbank.detritus.cli:main"
veneer = "doppelbank.veneer.cli:main"
format = "black:main"
lint = "scripts.lint:main"
check = "scripts.lint:check"
fix = "scripts.lint:fix"
buildproto = "scripts.buildproto:main"
preflight = "scripts.preflight:main"

[project.optional-dependencies]
dev = [
    "types-pytz>=2025.2.0.20250516",
    "ruff>=0.3.0",
    "black>=25.1.0",
    "mypy>=1.16.1,<2.0.0",
    "betterproto[compiler]>=1.2.5",
    "types-requests>=2.32.4.20250611",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doppelbank"]

[tool.ruff.lint]
# Comprehensive linting for greenfield project
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings  
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PIE",    # flake8-pie
    "T20",    # flake8-print
    "TCH",    # flake8-type-checking
    "UP",     # pyupgrade
    "FURB",   # refurb
    "TID252", # no relative imports
]

# Ignore print statements in CLI tools and scripts where they are appropriate
[tool.ruff.lint.per-file-ignores]
"**/cli.py" = ["T201"]
"**/scripts/*.py" = ["T201"]
"src/generated/*.py" = ["ALL"]

[tool.ruff]
# Set line length to match black's default
line-length = 100

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Ignore missing stubs for generated modules
[[tool.mypy.overrides]]
module = "generated.*"
ignore_missing_imports = true
